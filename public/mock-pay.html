<!doctype html><html><head><meta charset="utf-8"><title>Mock PayPal checkout</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>Mock PayPal checkout</h1><span class="tag">Mock mode — add sandbox keys for the real PayPal sandbox flow</span></header>
<main style="padding:24px"><p>Order <b id="o"></b></p><button class="primary" id="ok">Approve payment (mock)</button> <a href="/">Cancel</a></main>
<script>const t=new URLSearchParams(location.search).get('token');document.getElementById('o').textContent=t;
document.getElementById('ok').onclick=()=>location.href='/paypal/return?token='+encodeURIComponent(t);</script></body></html>
